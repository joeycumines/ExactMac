  exactmac.type.Region element_frame = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Exact active display resource selected from the unpadded element frame.
  string display = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "exactmac/Display"}
  ];

  // Exact encoded logical region in Global Display Coordinates (top-left
  // origin), after pixel padding, display-edge clipping, and pixel alignment.
  exactmac.type.Region region = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Encoded image pixels per logical display point.
  double scale = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Exact requested padding in encoded image pixels.
  int32 padding = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether display-edge clipping removed any requested padded footprint.
  bool clipped = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request to capture a screenshot of a screen region.
message CaptureRegionScreenshotRequest {
  // Region to capture.
  // Uses Global Display Coordinates (top-left origin, Y increases downward).
  // See exactmac.type.Point message documentation for detailed coordinate system explanation.
  exactmac.type.Region region = 1 [(google.api.field_behavior) = REQUIRED];

  // Image format.
  ImageFormat format = 2 [(google.api.field_behavior) = OPTIONAL];

  // JPEG quality (1-100, only for JPEG format). A zero value selects the
  // effective default quality of 85.
  int32 quality = 3 [(google.api.field_behavior) = OPTIONAL];

  // Whether to enable OCR text extraction.
  bool ocr_enabled = 4 [(google.api.field_behavior) = OPTIONAL];

  // Exact display resource containing the region. If omitted, the display is
  // inferred from the region in Global Display Coordinates (top-left origin).
  string display = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "exactmac/Display"}
  ];
}

// Response from capturing a region screenshot.
message CaptureRegionScreenshotResponse {
  // Image data (encoded according to format). PNG and TIFF preserve source
  // alpha when present; JPEG discards alpha because JPEG is opaque-only.
  bytes image_data = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Image format used.
  ImageFormat format = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Image width in pixels.
  int32 width = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Image height in pixels.
  int32 height = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Region that was captured.
  exactmac.type.Region region = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // OCR outcome. Unset when OCR was not requested; successful empty text is
  // distinct from extraction failure.
  oneof ocr_result {
    // Successfully extracted OCR text. An empty string is a successful result.
    string ocr_text = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

    // OCR extraction failure for an otherwise successful image capture.
    google.rpc.Status ocr_error = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  }

  // Exact active display resource from which the region was captured.
  string display = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "exactmac/Display"}
  ];

  // Encoded image pixels per logical display point.
  double scale = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

